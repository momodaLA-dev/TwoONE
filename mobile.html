<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>加入 A/B 派對</title><link rel="stylesheet" href="./styles.css"></head><body><main class="app"><section id="join" class="glass mobile-card"><div class="muted">ROOM <strong id="roomLabel"></strong></div><h1>🎮 加入遊戲</h1><label for="nameInput">你的名字</label><input id="nameInput" maxlength="12" placeholder="例如：若瑩" style="width:100%;margin-top:8px;padding:16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:white"><div id="joinMsg" class="muted" style="min-height:24px;margin-top:8px"></div><button id="joinBtn" class="primary" style="width:100%">加入遊戲</button></section><section id="waiting" class="glass mobile-card hidden"><div style="font-size:64px;text-align:center">🎈</div><h1 style="text-align:center">加入成功</h1><h2 id="welcome" style="text-align:center"></h2><p id="waitText" class="muted" style="text-align:center">請看著大螢幕，等待主持人開始。</p></section><section id="vote" class="mobile-card hidden"><div class="glass"><div id="mobileProgress" class="muted"></div><h2 id="mobileQuestion" style="text-align:center"></h2><button id="voteA" class="mobile-choice mobile-a">A</button><button id="voteB" class="mobile-choice mobile-b">B</button><div id="voteMsg" class="status">請選擇 A 或 B</div></div></section><section id="end" class="glass mobile-card hidden"><div style="font-size:64px;text-align:center">🏆</div><h1 style="text-align:center">遊戲結束</h1><h2 id="myScore" style="text-align:center"></h2><p class="muted" style="text-align:center">請看大螢幕排行榜。</p></section></main><script type="module" src="./mobile.js"></script></body></html>
