<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A/B 派對投票大亂鬥</title><link rel="stylesheet" href="./styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div id="flash" class="flash"></div><main id="app" class="app"><header class="header"><div class="brand">A / B 派對投票大亂鬥</div><div class="room-badge">房號 <span id="roomCode">-----</span></div></header>
<section id="lobby" class="grid2"><div class="glass"><div class="muted">手機掃碼加入</div><h2>加入本局</h2><div id="qr" class="qr-box"></div><div id="joinUrl" class="join-url"></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button id="startBtn" class="primary">開始遊戲</button><button id="newRoomBtn" class="secondary">建立新房</button></div></div><div class="glass"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>玩家等待區</h2><strong id="playerCount">0 人</strong></div><div id="players" class="player-wrap"></div><p class="muted">開始時會自動補成 3 人以上的奇數，避免 A/B 平手。</p></div></section>
<section id="category" class="glass hidden"><div class="muted">STEP 1 / 2</div><h2>選擇題目類別</h2><div class="setting-grid"><button class="setting-card cat" data-cat="life"><span class="emoji">🏠</span><b>生活</b></button><button class="setting-card cat" data-cat="food"><span class="emoji">🍔</span><b>食物</b></button><button class="setting-card cat" data-cat="love"><span class="emoji">❤️</span><b>愛情</b></button><button class="setting-card cat" data-cat="family"><span class="emoji">👨‍👩‍👧</span><b>親情</b></button><button class="setting-card cat" data-cat="mixed"><span class="emoji">🎲</span><b>綜合</b></button></div></section>
<section id="count" class="glass hidden"><div class="muted">STEP 2 / 2</div><h2>選擇題數</h2><div class="count-grid"><button class="count-card cnt" data-count="5">5 題</button><button class="count-card cnt" data-count="10">10 題</button><button class="count-card cnt" data-count="15">15 題</button></div></section>
<section id="game" class="glass hidden"><div class="question-meta"><strong id="progress">第 1 / 5 題</strong><strong>⏱ <span id="timer">8</span>s</strong></div><div class="timer-shell"><div id="timerBar" class="timer-bar"></div></div><div id="questionText" class="question"></div><div class="battle"><div id="boxA" class="choice choice-a"><div style="position:relative;z-index:1;text-align:center;padding:45px 18px"><div class="letter">A</div><div id="answerA" class="answer"></div><div id="votesA" class="vote-count">0 票</div></div></div><div class="vs">VS</div><div id="boxB" class="choice choice-b"><div style="position:relative;z-index:1;text-align:center;padding:45px 18px"><div class="letter">B</div><div id="answerB" class="answer"></div><div id="votesB" class="vote-count">0 票</div></div></div></div><div id="status" class="status">等待玩家投票</div></section>
<section id="ranking" class="glass hidden"><div class="muted">FINAL RESULT</div><h2>🏆 最終排行榜</h2><div id="rankList" class="rank-list"></div><button id="restartBtn" class="primary" style="margin-top:18px">回到等待區</button></section></main><script type="module" src="./screen.js"></script></body></html>
